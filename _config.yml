# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Segun Samuel # Your name / site title
first_name: Segun
middle_name:
last_name: Samuel
email: your.email@example.com # UPDATE THIS
description: >
  PhD Researcher in Electrical & Computer Engineering.
  Building AI-powered assistive indoor navigation for blind and low-vision users.
footer_text: >
  © 2026 Segun Samuel. Built with <a href="https://github.com/alshedivat/al-folio">al-folio</a>.

url: https://segusamuel.github.io # UPDATE: your GitHub Pages URL
baseurl: # Leave blank for user site (username.github.io)

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: false
search_enabled: true
socials_in_search: true

# Dimensions
max_width: 800px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: true
serve_schema_org: true
og_image: # Path to your default social sharing image

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------

github_username: segusamuel # UPDATE
linkedin_username: segusamuel # UPDATE
scholar_userid: # UPDATE: your Google Scholar ID
orcid_id: # UPDATE: your ORCID
twitter_username: # UPDATE if applicable

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------

google_analytics: # UPDATE: your GA tracking ID
cronitor_analytics: # UPDATE if applicable

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: Thinking Out Loud
blog_description: Reflections on accessibility, AI, safety, and the research journey.
permalink: /blog/:year/:title/

# Pagination
pagination:
  enabled: true

# Comments (optional - enable later)
# disqus_shortname: segusamuel

# External sources
# (optional: pull from Google Scholar, DBLP, etc.)
# scholar:
#   last_name: Samuel
#   first_name: Segun

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

announcements:
  enabled: true
  scrollable: true
  limit: 5

latest_posts:
  enabled: true
  scrollable: true
  limit: 3

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & Coverage
include: ["_pages"]
exclude:
  - bin/
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE

# Plug-ins
plugins:
  - jekyll-archives
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

# Sitemap settings
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Jekyll Scholar (Bibliography)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Samuel]
  first_name: [Segun]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

# -----------------------------------------------------------------------------
# Optional features
# -----------------------------------------------------------------------------

enable_google_analytics: false # Set true when ready
enable_cronitor_analytics: false
enable_google_verification: false
enable_bing_verification: false
enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: true
enable_medium_zoom: true

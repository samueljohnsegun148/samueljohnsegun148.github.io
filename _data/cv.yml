- title: Research Projects
  type: time_table
  contents:
    - title: AI-Powered Assistive Indoor Navigation
      year: Present
      description:
        - Smartphone-based conversational system for blind and low-vision users
        - Real-time disorientation detection and anxiety-level assessment
        - Adaptive recovery guidance that responds to user emotional and cognitive state
        - Addressing the critical gap between outdoor GPS navigation and indoor wayfinding
    - title: Indoor Wayfinding & Recovery
      year: Present
      description:
        - Investigating why recovery from disorientation — not just prevention — is the critical unsolved problem
        - Studying how non-trained human assistance often worsens disorientation
        - Designing systems that restore user confidence and environmental awareness
    - title: Accessibility as a Safety Imperative
      year: Present
      description:
        - Reframing accessibility as a health and safety issue, not just a convenience
        - Connecting HSE principles to assistive technology design
        - Hospital navigation as a patient safety challenge
